<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ShelfShare</title>
<style>
:root{color-scheme:light dark;--bg:#faf7f2;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--ac:#b4472b;--bd:#e8e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#181513;--card:#242019;--tx:#f1ebe3;--mu:#a1958a;--ac:#e0704f;--bd:#3a332b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
header nav{display:flex;gap:14px;align-items:center}a{color:var(--ac);text-decoration:none;font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px}h2{margin:28px 0 8px;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mu{color:var(--mu);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;color:var(--mu);font-size:13px}.stats b{display:block;font-size:24px;color:var(--tx)}
input{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
button,.btn{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:600 14px system-ui;cursor:pointer;display:inline-block}
button.g{background:none;color:var(--ac);border:1px solid var(--ac)}form.in{display:inline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .w{grid-column:1/-1}.row{display:flex;gap:8px}
.flash{background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:10px 14px;margin:10px 0}
.tag{font-size:12px;padding:2px 9px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}
.cam{width:100%;max-width:360px;border-radius:8px;margin-top:8px;display:block}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><a href="/">📚 ShelfShare</a>{% if user %}<nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('browse')}}">Browse</a>
<a href="{{url_for('wallet')}}">{{user.balance|usd}}</a>
<form class="in" method="post" action="{{url_for('logout')}}">{{csrf_field()}}<button class="g">Log out</button></form></nav>{% endif %}</header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block c %}{% endblock %}</main>
<script>
async function scanInto(btn,input,fmts,cb){
 if(!('BarcodeDetector' in window)){alert('Camera scanning isn’t supported in this browser. Type the code instead.');return}
 let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){alert('Camera unavailable.');return}
 const v=document.createElement('video');v.playsInline=true;v.className='cam';btn.after(v);v.srcObject=s;await v.play();
 const d=new BarcodeDetector({formats:fmts});
 (async function t(){if(!v.isConnected)return;try{const r=await d.detect(v);if(r.length){input.value=r[0].rawValue;s.getTracks().forEach(k=>k.stop());v.remove();cb&&cb();return}}catch(e){}setTimeout(t,250)})();
}
</script></body></html>
